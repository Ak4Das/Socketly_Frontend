<svg width="60" height="60" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgb(66, 103, 178)"></stop>
      <stop offset="100%" stop-color="rgb(138, 43, 226)"></stop>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="rgba(0,0,0,0.1)"></feDropShadow>
    </filter>
  </defs>

  <rect x="5" y="5" width="50" height="50" rx="10" fill="url(#bgGradient)" filter="url(#shadow)"></rect>

  <text x="30" y="32" text-anchor="middle" dominant-baseline="middle" fill="white" font-size="40" font-weight="700" font-family="Arial, Helvetica, sans-serif">
    S
  </text>
</svg>